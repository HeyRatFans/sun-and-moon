<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sun &amp; Moon</title>
  <link rel="stylesheet" href="sun-moon.css">
</head>
<body>
  <main>
    <div class="display">
      <canvas id="sky" width="400" height="60" role="img"
              aria-label="Animated sky showing the current position of the sun and moon"></canvas>
      <div class="keys" aria-label="Keyboard shortcuts">
        <div class="page">
          <i>1/7</i>
          <span><kbd>&uarr;</kbd> Speed up time</span>
          <span><kbd>&darr;</kbd> Slow down time</span>
        </div>
        <div class="page">
          <i>2/7</i>
          <span><kbd>Space</kbd> Pause time</span>
          <span><kbd>R</kbd> Reset time</span>
        </div>
        <div class="page">
          <i>3/7</i>
          <span><kbd>C</kbd> Show / hide date and time</span>
        </div>
        <div class="page">
          <i>4/7</i>
          <span><kbd>M</kbd> Real sky on / off</span>
          <span><kbd>V</kbd> Viewing angle</span>
        </div>
        <div class="page">
          <i>5/7</i>
          <span><kbd>N</kbd> Sky names</span>
          <span><kbd>Y</kbd> Daytime names</span>
        </div>
        <div class="page">
          <i>6/7</i>
          <span><kbd>S</kbd> Next solar eclipse</span>
          <span><kbd>L</kbd> Next lunar eclipse</span>
        </div>
        <div class="page">
          <i>7/7</i>
          <span><kbd>D</kbd> Total solar eclipse</span>
          <span><kbd>K</kbd> Total lunar eclipse</span>
        </div>
      </div>
      <button type="button" class="info" title="Keyboard shortcuts" aria-label="Keyboard shortcuts" aria-expanded="false">
        <!-- "info-circle" from Tabler Icons (https://tabler.io/icons), MIT License, copyright (c) 2020-2026 Paweł Kuna -->
        <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" aria-hidden="true">
          <defs>
            <path id="info-shape" d="M3 12a9 9 0 1 0 18 0a9 9 0 0 0 -18 0M12 9h.01M11 12h1v4h1" />
            <!-- cuts the icon out of its outline, which would otherwise show through it -->
            <mask id="info-cut" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
              <rect width="24" height="24" fill="#fff" />
              <use href="#info-shape" stroke="#000" />
            </mask>
          </defs>
          <!-- a faint dark edge, as round the text on the display but lighter, then the icon -->
          <use href="#info-shape" stroke="#000" stroke-opacity=".15" stroke-width="2.34" mask="url(#info-cut)" />
          <use class="icon" href="#info-shape" stroke="currentColor" />
        </svg>
      </button>
    </div>
  </main>
  <script src="moon-phase.js"></script>
  <script src="sun-times.js"></script>
  <script src="swf-data.js"></script>
  <script src="sky-data.js"></script>
  <script src="sky-names.js"></script>
  <script src="night-sky.js"></script>
  <script src="sun-moon.js"></script>
</body>
</html>
